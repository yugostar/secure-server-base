spring.application.name=secure-server-base

spring.datasource.url=${DB_URL:jdbc:h2:mem:secure_server_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE_PATH:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${SSL_KEY_ALIAS:}

logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:DEBUG}

app.security.bootstrap-admin.username=${APP_ADMIN_USERNAME:}
app.security.bootstrap-admin.password=${APP_ADMIN_PASSWORD:}

app.jwt.secret=${APP_JWT_SECRET:dev-secret-change-me-dev-secret-change-me-32bytes}
app.jwt.issuer=${JWT_ISSUER:secure-server-base}
app.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:600}
app.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:604800}
