name: Desktop GUI CI

on:
  push:
  pull_request:

jobs:
  build-desktop-gui:
    name: Build Win32 GUI, Service and Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S desktop -B build/desktop -G "Visual Studio 17 2022" -A x64

      - name: Build Release exe
        run: cmake --build build/desktop --config Release --parallel

      - name: Prepare application artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item build\desktop\Release\SakuraShield.exe artifacts\SakuraShield.exe
          Copy-Item build\desktop\Release\SakuraShieldService.exe artifacts\SakuraShieldService.exe
          Copy-Item desktop\demo artifacts\demo -Recurse
          Copy-Item desktop\avdb artifacts\avdb -Recurse

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer\SakuraShield.iss
          if (-not (Test-Path artifacts\SakuraShieldSetup.exe)) {
            throw "Installer was not created"
          }

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakuraShield-suite-windows-x64
          path: |
            artifacts/SakuraShield.exe
            artifacts/SakuraShieldService.exe
            artifacts/demo
            artifacts/avdb

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakuraShield-installer-windows-x64
          path: artifacts/SakuraShieldSetup.exe
